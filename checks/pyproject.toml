[project]
name = "checks"
version = "0.1.0"
description = "The tools behind the standards' check scripts"
requires-python = ">=3.15"
dependencies = ["ordered"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff", "basedpyright", "vulture", "import-linter",
    "pytest", "coverage", "hypothesis",
    "mutmut; sys_platform != 'win32'",  # mutmut needs WSL on Windows
]

[tool.uv]
required-version = ">=0.13"

[tool.uv.sources]
ordered = { path = "../python/ordered", editable = true }

[tool.importlinter]
root_package = "checks"

[[tool.importlinter.contracts]]
name = "core is the bottom layer"
type = "layers"
containers = ["checks"]
layers = ["(__main__)", "shell", "core"]
exhaustive = true

[tool.pytest]
strict = true
testpaths = ["tests"]
addopts = ["--hypothesis-profile=fast", "-m", "not slow"]
markers = ["slow: runs only in the full profile"]

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args = ["--hypothesis-profile=mutation"]

[tool.coverage.run]
branch = true
source = ["src"]
