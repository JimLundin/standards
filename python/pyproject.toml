[project]
requires-python = ">=3.15"

[dependency-groups]
dev = [
    "ruff", "basedpyright", "vulture", "import-linter",
    "pytest", "coverage", "hypothesis", "mutmut",
]

[tool.ruff]
line-length = 80
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # no required docstrings
    "DOC",     # no required docstring sections
    "E501",    # line length is the formatter's job
    "W505",    # doc line length is the formatter's job
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright headers
]

[tool.basedpyright]
typeCheckingMode = "all"

[tool.pytest]
strict = true

[tool.coverage.run]
branch = true
