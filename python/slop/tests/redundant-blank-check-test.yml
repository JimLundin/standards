id: redundant-blank-check
valid:
  - |
    def f(lines):
        for line in lines:
            text = line.strip()
            if not text:
                continue
            g(text)
invalid:
  - |
    def f(lines):
        for line in lines:
            if line.isspace() or not line:
                continue
            text = line.strip()
            if not text:
                continue
            g(text)
