id: consecutive-if-same-variable
valid:
  - |
    def f(x, y):
        if x == 1:
            return "one"
        if y == 2:
            return "two"
        return "many"
invalid:
  - |
    def f(x):
        if x == 1:
            return "one"
        if x == 2:
            return "two"
        return "many"
