id: dict-get-empty-string-default
valid:
  - |
    def f(data, key):
        value = data.get(key)
        if value is not None:
            return value
        return "none"
invalid:
  - |
    def f(data, key):
        value = data.get(key, "")
        if value:
            return value
        return "none"
