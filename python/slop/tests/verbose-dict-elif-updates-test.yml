id: verbose-dict-elif-updates
valid:
  - |
    def f(d, x):
        a()
        d["sign"] = 1 if x > 0 else -1
        b()
invalid:
  - |
    def f(d, x):
        if x > 0:
            a()
            d["sign"] = 1
            b()
        elif x < 0:
            a()
            d["sign"] = -1
            b()
