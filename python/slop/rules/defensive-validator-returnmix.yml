id: defensive-validator-returnmix
language: python
severity: warning
message: "Function combines `isinstance` guards with `is None` guards and returns; stop per-field validation — assert the contract at the boundary."
metadata:
  category: slop
  min_file_count: 2
rule:
  kind: function_definition
  all:
    - has:
        field: body
        kind: block
        has:
          stopBy: end
          kind: if_statement
          any:
            - pattern: |
                if not isinstance($V, $T):
                    return $$$A
            - pattern: |
                if not isinstance($V, ($$$T)):
                    return $$$A
    - has:
        field: body
        kind: block
        has:
          stopBy: end
          kind: if_statement
          any:
            - pattern: |
                if $V2 is None:
                    return $$$A
            - pattern: |
                if not $V2:
                    return $$$A
