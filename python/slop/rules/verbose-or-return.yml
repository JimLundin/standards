id: verbose-or-return
language: python
severity: warning
message: "`if x: return True` - combine with later condition or `return x or ...`"
metadata:
  category: slop
rule:
  kind: if_statement
  has:
    kind: block
    has:
      kind: return_statement
      regex: return True
  not:
    has:
      kind: else_clause
