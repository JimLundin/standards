id: consecutive-append-calls
language: python
severity: info
message: "Consecutive `.append()` calls - build the list in one expression, `FrozenList((a, b, c))`"
metadata:
  weight: 1
  category: slop
rule:
  kind: expression_statement
  has:
    kind: call
    has:
      kind: attribute
      regex: \.append$
  follows:
    kind: expression_statement
    has:
      kind: call
      has:
        kind: attribute
        regex: \.append$
    stopBy: neighbor
