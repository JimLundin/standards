id: manual-find-return-none
language: python
severity: warning
message: "`for x in it: if c: return r; return None` - use `next((r for x in it if c), None)`"
metadata:
  category: slop
rule:
  kind: for_statement
  pattern: |
    for $ITEM in $ITER:
        if $COND:
            return $RET
  precedes:
    kind: return_statement
    pattern: return None
    stopBy: neighbor
