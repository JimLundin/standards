id: split-magic-index
language: python
severity: warning
message: "`s.split()[N]` with magic index - unpack into named vars (`a, b, c = s.split()`)"
metadata:
  category: slop
rule:
  kind: subscript
  all:
  - has:
      kind: call
      has:
        kind: attribute
        regex: \.split$
  - has:
      kind: integer
      regex: ^([2-9]|[1-9][0-9]+)$
