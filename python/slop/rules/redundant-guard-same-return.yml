id: redundant-guard-same-return
language: python
severity: warning
message: "`if c: return r; return r` - drop the guard, both paths return the same value"
metadata:
  category: slop
rule:
  kind: if_statement
  pattern: |
    if $COND:
        return $RET
  precedes:
    kind: return_statement
    pattern: return $RET
    stopBy: neighbor
