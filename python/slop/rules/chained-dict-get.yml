id: chained-dict-get
language: python
severity: warning
message: "`.get().get()` chain - extract helper or use `operator.itemgetter` / try-except KeyError"
metadata:
  category: slop
rule:
  kind: call
  has:
    kind: attribute
    has:
      kind: call
      has:
        kind: attribute
        regex: \.get$
    regex: \.get$
