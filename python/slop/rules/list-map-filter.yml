id: list-map-filter
language: python
severity: warning
message: "`list(map(f, xs))` / `list(filter(p, xs))` - use a list comprehension"
metadata:
  category: slop
rule:
  kind: call
  all:
  - has:
      kind: identifier
      regex: ^list$
  - has:
      kind: argument_list
      has:
        kind: call
        has:
          kind: identifier
          regex: ^(map|filter)$
