id: repeated-validation-calls
language: python
severity: warning
message: "Repeated `validate_*()` calls - loop over a list of validators"
metadata:
  category: slop
rule:
  kind: expression_statement
  has:
    kind: call
    regex: ^validate_
  follows:
    kind: expression_statement
    has:
      kind: call
      regex: ^validate_
