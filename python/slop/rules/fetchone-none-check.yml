id: fetchone-none-check
language: python
severity: info
message: "`row = cursor.fetchone(); if row is None:` - extract to `fetch_one_or_none()` helper"
metadata:
  weight: 1
  category: slop
rule:
  kind: if_statement
  has:
    kind: comparison_operator
    regex: is None
  follows:
    kind: expression_statement
    has:
      kind: assignment
      has:
        kind: call
        has:
          kind: attribute
          regex: \.fetchone$
    stopBy: neighbor
