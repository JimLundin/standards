id: if-pass-else-action
language: python
severity: info
message: "`if c: pass else: ...` - invert to `if not c: ...`"
metadata:
  weight: 1
  category: slop
rule:
  kind: if_statement
  all:
  - has:
      kind: block
      has:
        kind: pass_statement
      not:
        has:
          kind: expression_statement
  - has:
      kind: else_clause
