id: init-populate-iterate-dict
language: python
severity: warning
message: "`$DICT = {}`, filled in a loop, then iterated - build it in one expression, `FrozenOrderedDict((k, v) for ...)`"
metadata:
  category: slop
rule:
  pattern: "for $VARS in $DICT.$METHOD():\n    $$$BODY\n"
  follows:
    all:
    - kind: for_statement
    - has:
        kind: subscript
        all:
        - has:
            kind: identifier
            field: value
            pattern: $DICT
        - inside:
            kind: assignment
            field: left
        stopBy: end
    - follows:
        kind: expression_statement
        has:
          kind: assignment
          all:
          - has:
              kind: identifier
              field: left
              pattern: $DICT
          - has:
              kind: dictionary
              field: right
              not:
                has:
                  kind: pair
        stopBy:
          kind: for_statement
    stopBy: end
constraints:
  METHOD:
    regex: ^(items|keys|values)$
