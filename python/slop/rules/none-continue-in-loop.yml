id: none-continue-in-loop
language: python
severity: info
message: "`if x is None: continue` inside a loop is defensive null-skipping; filter at the source or raise on contract violation."
metadata:
  weight: 1
  category: slop
  min_file_count: 2
rule:
  kind: if_statement
  pattern: |
    if $X is None:
        continue
  inside:
    stopBy: end
    any:
      - kind: for_statement
      - kind: while_statement
