# Standard Ruff configuration for Python projects.
# Use from a project's pyproject.toml:
#   [tool.ruff]
#   extend = "../standards/python/ruff.toml"
# target-version is left unset so Ruff reads the project's requires-python.

line-length = 120

[format]
line-ending = "lf"

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # import sorting
    "N",        # naming
    "UP",       # pyupgrade: modern syntax for the target version
    "B",        # bugbear: likely bugs
    "SIM",      # simplifications
    "C4",       # comprehensions
    "RET",      # return-statement hygiene
    "PIE",      # unnecessary code (pass, duplicate class fields, ...)
    "PERF",     # avoidable slowness in loops
    "FURB",     # refurb: modern idioms
    "PTH",      # pathlib over os.path
    "PL",       # pylint, including complexity limits
    "RUF",      # ruff-specific
    "ERA",      # commented-out code
    "TID252",   # no relative imports from parent packages
    "FBT001", "FBT002",  # no positional boolean flags
]
ignore = [
    "PLR2004",  # magic-value comparisons: too noisy for parsers and tables
]

[lint.pylint]
max-args = 6
max-branches = 15
max-returns = 8
max-statements = 60

[lint.per-file-ignores]
"tests/**" = ["PLR0913", "FBT001", "FBT002"]
"**/test_*.py" = ["PLR0913", "FBT001", "FBT002"]
