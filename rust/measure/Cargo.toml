[package]
name = "rust-decisions"
version = "0.1.0"
edition = "2024"
description = "Counts the decisions each Rust function writes in its source"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JimLundin/standards"
readme = false
keywords = ["complexity", "decisions", "metrics"]
categories = ["development-tools"]
publish = false

[package.metadata.standards]
layer = "shell"

[dependencies]
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde_json = "1.0.154"
syn = { version = "3.0.10", default-features = false, features = ["full", "parsing", "visit"] }

[workspace]

