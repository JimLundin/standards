[package]
name = "rust-decisions"
version = "0.1.0"
edition = "2024"
description = "Counts the decisions each Rust function writes in its source"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JimLundin/home"
readme = false
keywords = ["complexity", "decisions", "metrics"]
categories = ["development-tools"]
publish = false

[package.metadata.standards]
layer = "shell"

[dependencies]
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde_json = "1.0.154"
syn = { version = "3.0.10", default-features = false, features = ["full", "parsing", "visit"] }

[workspace]

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
