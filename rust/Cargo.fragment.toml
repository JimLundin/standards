# Standard Rust lints: every Clippy lint group except `restriction` (which
# Clippy says must not be enabled whole, because its lints contradict each
# other), as errors. Cargo cannot inherit lints from outside a workspace, so
# copy this into the crate's Cargo.toml, or into [workspace.lints] with
# `[lints] workspace = true` in each member.
# Also use edition = "2024" (the latest) and copy rust-toolchain.toml.

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# On top of the presets: restriction lints that tighten without contradicting.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

# Property tests. Mutation testing uses cargo-mutants, a cargo subcommand
# (`cargo install cargo-mutants`), so it is not a dependency.
[dev-dependencies]
proptest = "1"
