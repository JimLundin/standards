# Standard Rust lint levels. Cargo cannot inherit lints from outside a
# workspace, so copy these sections into the crate's (or workspace's)
# Cargo.toml. In a workspace, put them under [workspace.lints.*] and add
# `[lints] workspace = true` to each member.

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they give in most crates:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Restriction lints worth having everywhere:
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
# Library crates may also want print_stdout/print_stderr = "warn"; they are
# left out here because they fire on every CLI binary.
