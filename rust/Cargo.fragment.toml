# A package is the pure core unless it declares itself the shell:
# [package.metadata.standards]
# layer = "shell"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dev-dependencies]
proptest = "1"

[profile.mutants]
inherits = "test"
debug = "none"
