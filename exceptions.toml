# The only place to relax a check. Suppression comments in code and weakened
# tool configs fail the exceptions step. Each entry needs a path glob, a rule
# and a reason. Rules are tool rule names (banned-api, IMM002,
# clippy::shadow_reuse, lint/style/noRestrictedGlobals), "mutation", "unused",
# "std" (a Rust package, by its Cargo.toml, that may use std), "api" (a Rust
# file whose public items may take more than data), "shell" (a Rust binary
# file whose functions may be complex, or Cargo.toml for the shell's share of
# decisions), or a drift:…
# rule printed by the check.
#
# [[exception]]
# path = "src/app/main.py"
# rule = "banned-api"
# reason = "the CLI entry point reads sys.argv and writes to stdout"
