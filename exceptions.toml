# The only place to relax a check. Suppression comments in code and weakened
# tool configs fail the exceptions step. Each entry needs a path glob, a rule
# and a reason. Rules are tool rule names (banned-api, IMM002,
# clippy::shadow_reuse, lint/style/noRestrictedGlobals, PUR003 or PUR001:attrs
# for one module), slop:<rule-id> (an ast-grep slop rule, such as
# slop:for-range-len), STR001 (a trivial wrapper), STR002 (a function above
# the cognitive complexity limit), either also as STR002:Class.method for
# one function, "mutation", "unused", "api" (a Rust file
# whose public items may take more than data), "shell" (a Rust shell file whose functions
# may make more decisions, or Cargo.toml for the shell's share of them),
# "box" (a Rust core file that may use Box, Rc or Arc),
# "flaky" (a Rust test, named by its nextest name or a glob of it, that
# nextest retries once; a pass on the retry is reported as flaky), or a
# drift:… rule printed by the check.
#
# [[exception]]
# path = "src/app/main.py"
# rule = "banned-api"
# reason = "the CLI entry point reads sys.argv and writes to stdout"
